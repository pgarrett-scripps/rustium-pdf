[package]
name = "rustium-pdf"
description = "Pure-Rust PDF page-primitive extraction and rendering: a thread-safe replacement for the pdfium surface used by rustypaper."
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/pgarrett-scripps/rustium-pdf"
homepage = "https://github.com/pgarrett-scripps/rustium-pdf"
documentation = "https://docs.rs/rustium-pdf"
keywords = ["pdf", "parser", "text-extraction", "render", "fonts"]
categories = ["parser-implementations", "text-processing", "rendering"]
# The published tarball carries the library and its examples, nothing else. corpus_diverse is
# development tooling — a Python scorer and a downloader — and has no business in a crate.
exclude = ["/.github", "/target", "/corpus_diverse", "*.png", "*.pdf"]

[dependencies]
flate2 = "1"
ttf-parser = "0.25"
tiny-skia = "0.11"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
md-5 = "0.10"
sha2 = "0.10"
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }

[dev-dependencies]

[package.metadata.docs.rs]
all-features = true
