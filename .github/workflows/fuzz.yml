name: PDF fuzzing

on:
  pull_request:
    paths: ["src/**", "tests/**", "fuzz/**", "Cargo.*", ".github/workflows/fuzz.yml"]
  schedule:
    - cron: "19 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
      - run: cargo install cargo-fuzz --version 0.13.2 --locked
      - name: Seed the parser with valid and damaged documents
        run: |
          mkdir -p fuzz/corpus/document
          cp tests/fixtures/*.pdf fuzz/corpus/document/
      - name: Exercise parsing, extraction, and rendering
        run: cargo fuzz run document -- -max_total_time=60 -timeout=5 -rss_limit_mb=512 -max_len=262144
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: failing-pdfs
          path: fuzz/artifacts/
          if-no-files-found: ignore
